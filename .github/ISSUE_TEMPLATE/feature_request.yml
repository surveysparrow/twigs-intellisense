name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the extension makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: A code sample of the completion or behaviour you want helps.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part does this affect?
      options:
        - Completions / IntelliSense
        - Theme or config handling
        - Twigs Docs commands
        - Not sure
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
    validations:
      required: false
