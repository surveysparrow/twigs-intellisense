# Builds the plugin and lints the extension on every pull request and push
# to master.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# The workflow only reads the repository; no write access to anything.
permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build-plugin

      - name: Lint extension
        run: npx eslint . --max-warnings 0
        working-directory: packages/extension
