# Publishes packages/plugin to the npm registry when a GitHub Release is created.
# The extension is published separately by release.yml.

name: Publish to npm

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build-plugin

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build-plugin && cd packages/plugin && npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
